[package]
name = "stratum-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Stratum Android NativeActivity host for Horizon"

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
horizon-game = { path = "../horizon-game", default-features = false, features = ["audio"] }
horizon-client = { path = "../horizon-client", default-features = false }
winit = { version = "0.30.13", features = ["android-native-activity"] }
jni = "0.21.1"

[lints]
workspace = true
